<script>
  /* ---- BUY LINK: replace with your direct Amazon product URL ---- */
  var AMAZON_URL = "https://amzn.to/4vuCZI5"; // direct Amazon product link
  document.querySelectorAll('[data-buy]').forEach(function(a){ a.href = AMAZON_URL; });

  /* ---- in-page anchors: scroll the parent page when embedded ---- */
  document.querySelectorAll('a[href^="#"]').forEach(function(a){
    a.addEventListener('click', function(e){
      var target = document.querySelector(a.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      if (window.self !== window.top) {
        // Embedded in Duda: ask the parent page to scroll to iframe top + anchor offset
        parent.postMessage({ type:'jws-widget-scrollto', offset: target.getBoundingClientRect().top + window.pageYOffset }, '*');
      } else {
        target.scrollIntoView({ behavior:'smooth' });
      }
    });
  });

  /* ---- scroll reveal ---- */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:0.12});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

  /* ---- Duda iframe auto-resize (postMessage), matches existing JWS widget pattern ---- */
  function postHeight(){
    var h = document.documentElement.scrollHeight;
    parent.postMessage({ type:'jws-widget-resize', height:h }, '*');
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if (window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
</script>
